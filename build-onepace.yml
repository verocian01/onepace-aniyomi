name: Build One Pace Aniyomi Extension

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/all/onepace/**'
      - '.github/workflows/build-onepace.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone current Yuzono anime extension source tree
        run: |
          git clone --depth 1 https://github.com/yuzono/anime-extensions.git upstream

      - name: Add One Pace module
        run: |
          rm -rf upstream/src/all/onepace
          cp -R src/all/onepace upstream/src/all/onepace

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew src:all:onepace:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          find upstream/src/all/onepace/build -type f -name '*.apk' -print -exec cp {} artifact/onepace-aniyomi-debug.apk \;
          test -f artifact/onepace-aniyomi-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: onepace-aniyomi-apk
          path: artifact/onepace-aniyomi-debug.apk
          if-no-files-found: error
