name: Build One Pace Aniyomi Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Aniyomi extensions
        uses: actions/checkout@v4
        with:
          repository: yuzono/anime-extensions
          path: anime-extensions

      - name: Copy One Pace extension
        run: |
          mkdir -p anime-extensions/src/all/onepace
          cp -r src/all/onepace/* anime-extensions/src/all/onepace/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build extension
        working-directory: anime-extensions
        run: |
    ./gradlew spotlessApply
    ./gradlew src:all:onepace:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          find anime-extensions/src/all/onepace -name "*.apk" -exec cp {} output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onepace-aniyomi-apk
          path: output/*.apk
